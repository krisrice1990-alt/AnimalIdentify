<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Label animal sounds</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #101408; color: #e8f0dc; font-family: system-ui, sans-serif;
         margin: 0; padding: 16px; max-width: 560px; margin-inline: auto; }
  h2 { margin: 8px 0 4px; font-size: 20px; }
  .sub { color: #9db38a; font-size: 13px; margin-bottom: 12px; }
  audio { width: 100%; margin: 8px 0; }
  #play { width: 100%; padding: 18px; font-size: 22px; border: none; border-radius: 14px;
          background: #2e7d32; color: #fff; margin-bottom: 14px; }
  #play:active { background: #1b5e20; }
  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #choices button { padding: 16px 8px; font-size: 17px; border: 2px solid #3a4a2e;
                    border-radius: 12px; background: #1a2113; color: #e8f0dc; }
  #choices button:active { background: #2e7d32; border-color: #2e7d32; }
  #choices button.wide { grid-column: 1 / -1; }
  #bar { height: 8px; background: #222b18; border-radius: 4px; margin: 14px 0 4px; overflow: hidden; }
  #barfill { height: 100%; background: #7cc46a; width: 0%; }
  #count { color: #9db38a; font-size: 13px; }
  #done { margin-top: 10px; }
  #export { width: 100%; padding: 16px; font-size: 18px; border: none; border-radius: 12px;
            background: #2e7d32; color: #fff; margin: 10px 0; }
  textarea { width: 100%; height: 150px; background: #0a0d05; color: #b9d3a8;
             border: 1px solid #3a4a2e; border-radius: 8px; font-size: 12px; padding: 8px; }
  .hint { color: #9db38a; font-size: 13px; }
  #back { background: none; border: none; color: #9db38a; font-size: 14px;
          margin-top: 10px; text-decoration: underline; }
</style>
</head>
<body>
<h2 id="title">Label animal sounds</h2>
<div class="sub" id="subtitle">Listen to each clip, tap what you hear.</div>

<div id="quiz">
  <div id="count">Clip 1 of …</div>
  <div id="bar"><div id="barfill"></div></div>
  <audio id="player" controls preload="auto"></audio>
  <button id="play">▶ Play</button>
  <div id="choices">
    <button data-l="wolf">Wolf</button>
    <button data-l="coyote">Coyote</button>
    <button data-l="moose">Moose</button>
    <button data-l="bear">Bear</button>
    <button data-l="fox">Fox</button>
    <button data-l="dog">Dog</button>
    <button data-l="background" class="wide">Background / not an animal</button>
    <button data-l="unsure" class="wide">Not sure — skip</button>
  </div>
  <button id="back">← undo last</button>
</div>

<div id="done" hidden>
  <h2>Batch complete 🎉</h2>
  <p class="hint">Send the downloaded file back to me in chat (or paste the text below).</p>
  <button id="export">Download labels file</button>
  <textarea id="paste" readonly></textarea>
</div>

<script>
let clips = [], idx = 0, answers = {};
const $ = id => document.getElementById(id);

try { answers = JSON.parse(localStorage.getItem('labels') || '{}'); } catch(e) { answers = {}; }

fetch('clips.json').then(r => r.json()).then(m => {
  clips = m.clips;
  if (m.title) $('title').textContent = m.title;
  // resume where left off
  idx = 0;
  while (idx < clips.length && answers[clips[idx].id]) idx++;
  show();
});

function show() {
  if (idx >= clips.length) return finish();
  const c = clips[idx];
  $('count').textContent = `Clip ${idx + 1} of ${clips.length}`;
  $('barfill').style.width = (100 * idx / clips.length) + '%';
  const p = $('player');
  p.src = 'clips/' + c.file;
  p.load();
}

$('play').onclick = () => {
  const p = $('player');
  if (p.paused) p.play(); else p.pause();
};

document.querySelectorAll('#choices button').forEach(b => {
  b.onclick = () => {
    answers[clips[idx].id] = b.dataset.l;
    localStorage.setItem('labels', JSON.stringify(answers));
    idx++;
    show();
  };
});

$('back').onclick = () => {
  if (idx > 0) { idx--; delete answers[clips[idx].id];
    localStorage.setItem('labels', JSON.stringify(answers)); show(); }
};

function finish() {
  $('quiz').hidden = true;
  $('done').hidden = false;
  $('barfill').style.width = '100%';
  const lines = clips.map(c => `${c.id}=${answers[c.id] || 'unsure'}`);
  $('paste').value = lines.join('\n');
  localStorage.removeItem('labels');
}

$('export').onclick = () => {
  const blob = new Blob([$('paste').value], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'labels.txt';
  a.click();
};
</script>
</body>
</html>
